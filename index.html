<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>  — ¿Qué opina tu ciudad?</title>
  
  <!-- CSS INTEGRADO AQUÍ MISMO (Ignoramos styles.css) -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-color: #0a0a0a;
      --bg-card: #141414;
      --bg-card-hover: #1c1c1c;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --accent: #6366f1;
      --border: #27272a;
      --success: #22c55e;
      --error: #ef4444;
      
      --color-clima: #3b82f6;
      --color-transporte: #f97316;
      --color-vibra: #a855f7;
      --color-calidad: #10b981;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 2rem 1rem;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header { text-align: center; max-width: 800px; margin: 0 auto 3rem auto; }
    .header-graphic { display: flex; justify-content: center; color: var(--accent); margin-bottom: 1rem; }
    header h1 {
      font-size: 3rem; font-weight: 800; letter-spacing: -0.05em; margin-bottom: 1rem;
      background: linear-gradient(to right, #fff, #a1a1aa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    header p { font-size: 1.1rem; color: var(--text-secondary); max-width: 600px; margin: 0 auto; }

    main { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 2rem; }

    .card {
      background-color: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; padding: 2.5rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover { border-color: #3f3f46; }
    .card h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; letter-spacing: -0.02em; }

    /* Barra de progreso */
    .progreso-container { margin-bottom: 2rem; }
    .progreso-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem; font-weight: 500; }
    .progreso-barra { width: 100%; height: 6px; background-color: var(--border); border-radius: 10px; overflow: hidden; }
    .progreso-relleno { height: 100%; background-color: var(--accent); width: 0%; transition: width 0.3s ease; }

    /* Formularios */
    label { display: block; font-size: 0.85rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; margin: 1.5rem 0 0.5rem; color: var(--text-secondary); }
    select {
      width: 100%; padding: 0.875rem 1rem; font-size: 1rem; color: var(--text-primary);
      background-color: var(--bg-color); border: 1px solid var(--border); border-radius: 10px;
      font-family: inherit; appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%239ca3af%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat; background-position: right 1rem center; background-size: 1.2em;
      cursor: pointer; transition: border-color 0.2s;
    }
    select:focus { outline: none; border-color: var(--accent); }
    select:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Botones generales */
    button {
      padding: 1rem; font-size: 1rem; font-weight: 600; border-radius: 10px;
      border: none; background-color: var(--text-primary); color: var(--bg-color);
      cursor: pointer; transition: all 0.2s ease; font-family: inherit;
    }
    button:hover:not(:disabled) { background-color: #d1d5db; transform: translateY(-1px); }
    button:disabled { background-color: var(--border); color: var(--text-secondary); cursor: not-allowed; }
    
    #btn-empezar { width: 100%; margin-top: 2rem; }

    /* Wizard: Controles */
    .wizard-controles { display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border); gap: 1rem; }
    .wizard-controles button { width: auto; margin-top: 0; padding: 0.8rem 1.5rem; }
    .btn-secundario { background-color: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
    .btn-secundario:hover:not(:disabled) { background-color: var(--bg-card-hover); color: var(--text-primary); }
    .btn-primario { background-color: var(--accent); color: #fff; }
    .btn-primario:hover:not(:disabled) { background-color: #4f46e5; }

    /* Preguntas */
    .pregunta {
      padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem;
      background-color: var(--bg-card); border: 1px solid var(--border);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .pregunta p { font-size: 1.1rem; font-weight: 500; margin-bottom: 1.25rem; line-height: 1.4; }
    .icono-pregunta { font-size: 1.2rem; margin-right: 0.5rem; }

    .cat-clima { border-left: 4px solid var(--color-clima); }
    .cat-transporte { border-left: 4px solid var(--color-transporte); }
    .cat-vibra { border-left: 4px solid var(--color-vibra); }
    .cat-calidad { border-left: 4px solid var(--color-calidad); }

    .opciones { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .opcion {
      flex: 1 1 auto; min-width: 50px; padding: 0.75rem 1rem;
      border: 1px solid var(--border); border-radius: 10px; background-color: var(--bg-color);
      cursor: pointer; text-align: center; font-weight: 600; color: var(--text-secondary);
      transition: all 0.15s ease; user-select: none;
    }
    .opcion:hover { border-color: #555; color: var(--text-primary); }

    .cat-clima .opcion.seleccionada { background-color: var(--color-clima); border-color: var(--color-clima); color: #fff; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); transform: scale(1.05); }
    .cat-transporte .opcion.seleccionada { background-color: var(--color-transporte); border-color: var(--color-transporte); color: #fff; box-shadow: 0 0 15px rgba(249, 115, 22, 0.3); transform: scale(1.05); }
    .cat-vibra .opcion.seleccionada { background-color: var(--color-vibra); border-color: var(--color-vibra); color: #fff; box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); transform: scale(1.05); }
    .cat-calidad .opcion.seleccionada { background-color: var(--color-calidad); border-color: var(--color-calidad); color: #fff; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); transform: scale(1.05); }

    /* Pestañas de Resultados */
    .tabs { display: flex; gap: 0.5rem; margin: 2rem 0; background-color: var(--bg-color); padding: 0.4rem; border-radius: 12px; border: 1px solid var(--border); }
    .tab { flex: 1; margin: 0; padding: 0.6rem; background: transparent; color: var(--text-secondary); font-size: 0.9rem; border-radius: 8px; }
    .tab:hover:not(.activo) { background-color: var(--bg-card-hover); color: var(--text-primary); transform: none; }
    .tab.activo { background-color: var(--bg-card); color: var(--text-primary); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

    /* Tabla de Resultados */
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.95rem; }
    th { text-align: left; padding: 1rem; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); border-bottom: 1px solid var(--border); font-weight: 600; }
    td { padding: 1rem; border-bottom: 1px solid var(--border); color: var(--text-primary); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background-color: var(--bg-card-hover); }
    .promedio { font-weight: 700; color: var(--accent); font-size: 1.1rem; }

    /* Utilidades */
    .hidden { display: none !important; }
    .mensaje { margin-top: 1rem; font-size: 0.9rem; text-align: center; color: var(--success); }
    .mensaje.error { color: var(--error); }
    footer { text-align: center; margin-top: 4rem; font-size: 0.85rem; color: var(--text-secondary); border-top: 1px solid var(--border); padding-top: 2rem; max-width: 640px; margin-left: auto; margin-right: auto; }

    /* Responsivo */
    @media (max-width: 600px) {
      .wizard-controles { flex-direction: column-reverse; }
      .wizard-controles button { width: 100%; }
      .card { padding: 1.5rem; }
      header h1 { font-size: 2.2rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-graphic">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
    </div>
    <h1> </h1>
    <p>Descubre cómo se siente tu ciudad comparada con el resto del país.</p>
  </header>

  <main>
    <!-- PASO 1 -->
    <section id="paso-ciudad" class="card">
      <h2>1. ¿De dónde eres?</h2>
      <label for="select-departamento">Departamento</label>
      <select id="select-departamento">
        <option value="">Cargando...</option>
      </select>

      <label for="select-ciudad">Ciudad</label>
      <select id="select-ciudad" disabled>
        <option value="">Primero elige un departamento</option>
      </select>

      <button id="btn-empezar" disabled>Empezar</button>
    </section>

    <!-- PASO 2 -->
    <section id="paso-preguntas" class="card hidden">
      <div class="progreso-container">
        <div class="progreso-header">
          <span id="progreso-texto">Paso 1</span>
          <span id="progreso-porcentaje">0%</span>
        </div>
        <div class="progreso-barra">
          <div id="progreso-relleno" class="progreso-relleno"></div>
        </div>
      </div>

      <div id="contenedor-preguntas"></div>

      <div class="wizard-controles">
        <button id="btn-atras" class="btn-secundario" disabled>← Atrás</button>
        <button id="btn-siguiente" class="btn-primario" disabled>Siguiente →</button>
      </div>
      
      <p id="mensaje-envio" class="mensaje"></p>
    </section>

    <!-- PASO 3 -->
    <section id="paso-resultados" class="card hidden">
      <h2>3. Resultados</h2>
      <label for="select-pregunta-resultado">Pregunta</label>
      <select id="select-pregunta-resultado"></select>

      <div class="tabs">
        <button class="tab activo" data-vista="ciudad">Por ciudad</button>
        <button class="tab" data-vista="departamento">Por departamento</button>
      </div>

      <div id="tabla-resultados"></div>
    </section>
  </main>

  <footer>
    <p>  · Proyecto académico · Datos anónimos</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
